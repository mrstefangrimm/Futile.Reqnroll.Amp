apiVersion: v1
kind: ConfigMap
metadata:
  name: webcalculatorapi-spec-config
  namespace: futile-tests
data:
  reqnroll.ampsettings.json: |
    {
      "webapi": {
        "profiles": {
          "Calculator": {
            "url": "http://service-s2i-webcalculatorapi:8080/api/calculation"
          }
        }
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: webcalculatorapi-specs
  namespace: futile-tests
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: specs
          image: image-registry.openshift-image-registry.svc:5000/futile-tests/s2i-webcalculatorapi-spec
          imagePullPolicy: Always
          workingDir: /src
          command: ["/bin/bash", "-lc"]
          args:
            - ./WebCalculatorApi.Specs/bin/Debug/net10.0/WebCalculatorApi.Specs
          volumeMounts:
            - name: reqnroll-settings
              mountPath: /src/WebCalculatorApi.Specs/bin/Debug/net10.0/reqnroll.ampsettings.json
              subPath: reqnroll.ampsettings.json
              readOnly: true
      volumes:
        - name: reqnroll-settings
          configMap:
            name: webcalculatorapi-spec-config
